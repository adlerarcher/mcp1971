name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir _site
          cp index.html CNAME header.png about.md _site/
          mkdir _site/about _site/glossary _site/coverage _site/reference
          cp about/index.html _site/about/
          cp glossary/index.html _site/glossary/
          cp coverage/index.html _site/coverage/
          cp reference/index.html _site/reference/
          cp -R vendor _site/vendor
          cp -R data _site/data
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
